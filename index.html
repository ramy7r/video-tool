<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الفيديوهات الشامل إلى MP4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #3b82f6);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .logo-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 700;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="url"] {
            width: 100%;
            padding: 15px 18px;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
        }
        input[type="url"]::placeholder {
            color: #64748b;
        }
        input[type="url"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }
        button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #result {
            margin-top: 25px;
            text-align: right;
        }
        .status-msg {
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .loading {
            color: #60a5fa;
            background: rgba(30, 58, 138, 0.4);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }
        .success {
            color: #4ade80;
            background: rgba(20, 83, 45, 0.4);
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .error {
            color: #f87171;
            background: rgba(127, 29, 29, 0.4);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .result-box {
            background: rgba(15, 23, 42, 0.8);
            padding: 14px;
            border-radius: 10px;
            text-align: left;
            direction: ltr;
            border: 1px solid #334155;
            word-break: break-all;
        }
        .result-box a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-icon">🚀</div>
    <h2>محول الفيديو الشامل</h2>
    <p class="subtitle">حول أي رابط فيديو إلى صيغة MP4 مباشرة وبضغطة زر</p>
    
    <form id="converterForm">
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="ألصق رابط الفيديو هنا (يوتيوب، تيك توك، انستغرام...)" required autocomplete="off">
        </div>
        <button type="submit" id="submitBtn">تحويل واستخراج MP4</button>
    </form>
    
    <div id="result"></div>
</div>

<script>
    document.getElementById('converterForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const url = document.getElementById('videoUrl').value;
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';
        resultDiv.innerHTML = '<div class="status-msg loading">⏳ جاري الاتصال بالسيرفر ومعالجة الرابط، يرجى الانتظار...</div>';

        try {
            // في حالة الاستضافة السحابية سيتم إرسال الطلب لنفس السيرفر التلقائي
            const response = await fetch('/convert', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (data.success) {
                resultDiv.innerHTML = `
                    <div class="status-msg success">✨ تم استخراج الرابط بنجاح!</div>
                    <div class="result-box">
                        <a href="${data.mp4Url}" target="_blank">🔗 اضغط هنا لتحميل أو مشاهدة الفيديو MP4 مباشرة</a>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `<div class="status-msg error">❌ ${data.error}</div>`;
            }
        } المشروع catch (err) {
            resultDiv.innerHTML = `<div class="status-msg error">❌ حدث خطأ في الاتصال بالخادم، تأكد من صحة الرابط.</div>`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    });
</script>

</body>
</html>
